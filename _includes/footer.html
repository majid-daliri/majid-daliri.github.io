<footer class="page__footer">
  <div class="footer__inner-wrap">
    <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
    <ul class="footer__links">
      <li><strong>Follow:</strong></li>
      {% if site.twitter.username %}<li><a href="https://twitter.com/{{ site.twitter.username }}">Twitter</a></li>{% endif %}
      {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}">GitHub</a></li>{% endif %}
    </ul>
    <div class="page__footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name }}. Powered by <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a> &amp; <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/" rel="nofollow">Minimal Mistakes</a>.</div>
  </div>
</footer>
