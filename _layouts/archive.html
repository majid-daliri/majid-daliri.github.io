---
layout: default
---
<main id="main" class="site-content{% unless page.author_profile %} site-content--wide{% endunless %}" tabindex="-1">
  {% include sidebar.html %}
  <article class="archive">
    <header class="page__header{% if page.pdf %} page__header--document{% endif %}">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.pdf %}
        <div class="document-actions">
          <a href="{{ page.pdf | relative_url }}" target="_blank" rel="noopener">Open PDF</a>
          <a class="document-download" href="{{ page.pdf | relative_url }}" download>Download PDF</a>
        </div>
      {% endif %}
    </header>
    {% if page.research_gallery %}{% include research-gallery.html %}{% endif %}
    {{ content }}
  </article>
</main>
