---
layout: archive
title: "CV"
published: false
permalink: /cv/
author_profile: false
pdf: /cv.pdf
redirect_from:
  - /wordpress/cv/
---
{% for preview in site.data.cv_preview.pages %}
  <figure class="cv-preview">
    <a href="{{ page.pdf | relative_url }}#page={{ forloop.index }}" target="_blank" rel="noopener">
      <img src="{{ preview.image | relative_url }}"
           alt="{{ site.name | escape }}'s CV, page {{ forloop.index }} of {{ forloop.length }}. Open the original PDF."
           width="{{ preview.width }}" height="{{ preview.height }}"
           loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
    </a>
    <figcaption>Page {{ forloop.index }} of {{ forloop.length }}</figcaption>
  </figure>
{% endfor %}
