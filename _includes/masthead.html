<header class="masthead">
  <nav class="masthead__inner-wrap" aria-label="Main navigation">
    <a class="site-title" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <img class="site-logo" src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="36" height="36">
      <span>{{ site.title }}</span>
    </a>
    <ul class="site-nav">
      {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
