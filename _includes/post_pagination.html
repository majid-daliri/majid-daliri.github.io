{% if page.previous or page.next %}
  <nav class="pagination" aria-label="Adjacent pages">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}" rel="prev">Previous</a>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}" rel="next">Next</a>{% endif %}
  </nav>
{% endif %}
