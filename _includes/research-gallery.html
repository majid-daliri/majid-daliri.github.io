<section class="research-gallery" data-research-gallery aria-labelledby="research-gallery-title">
  <header class="research-gallery__intro">
    <h2 id="research-gallery-title">Research in action</h2>
  </header>
  <div class="research-gallery__choices" role="group" aria-label="Research visualizations">
  {% for demo in site.data.research_demos %}
    <a class="research-gallery__choice" href="{{ demo.url }}" title="{{ demo.paper | escape }}" data-research-choice="{{ demo.id }}" data-research-title="{{ demo.title | escape }}" aria-label="{{ demo.label }}: {{ demo.caption | escape }}">
      <svg viewBox="0 0 80 44" width="80" height="44" aria-hidden="true" focusable="false">
        {% case demo.id %}
          {% when 'quantize' %}
            <g class="research-gallery__dots"><circle cx="12" cy="30" r="2.3"/><circle cx="21" cy="11" r="2.3"/><circle cx="27" cy="27" r="2.3"/><circle cx="38" cy="16" r="2.3"/><circle cx="48" cy="32" r="2.3"/><circle cx="56" cy="10" r="2.3"/><circle cx="63" cy="24" r="2.3"/><circle cx="70" cy="34" r="2.3"/></g>
            <path class="research-gallery__faint" d="M12 30L16 32M21 11L24 8M27 27L24 24M38 16H40M48 32H48M56 10V8M63 24H64M70 34L72 32"/>
          {% when 'rl' %}
            <path d="M6 22C27 22 35 5 66 5M6 22C27 22 35 15 66 15M6 22C27 22 35 27 66 27M6 22C27 22 35 39 66 39"/>
            <circle cx="6" cy="22" r="2.5"/><path class="research-gallery__accent" d="M67 5l3 3 5-6"/>
          {% when 'olympiad' %}
            <path class="research-gallery__faint" d="M5 29V5H23M10 34V10H28"/>
            <path d="M15 15H33V39H15ZM20 22H28M20 27H28M20 32H24M39 27H45M50 25L60 8 73 25Z"/>
            <g><circle cx="50" cy="25" r="2"/><circle cx="60" cy="8" r="2"/><circle cx="73" cy="25" r="2"/></g>
            <path class="research-gallery__accent" d="M58 35l4 4 9-10"/>
          {% when 'search' %}
            <path class="research-gallery__faint" d="M8 30L19 10 34 28 48 9 63 26 73 12M8 30L34 28 63 26M19 10L48 9 73 12M34 28L46 39 63 26"/>
            <path d="M8 30L34 28 48 9 73 12"/>
            <g><circle cx="8" cy="30" r="2.5"/><circle cx="34" cy="28" r="2.5"/><circle cx="48" cy="9" r="2.5"/><circle cx="73" cy="12" r="2.5"/></g>
            <circle class="research-gallery__target" cx="69" cy="7" r="5"/>
          {% when 'sketch' %}
            <path class="research-gallery__faint" d="M8 12H72M8 32H72"/>
            <path d="M20 12V32M48 12V32M64 12V32"/>
            <g><circle cx="20" cy="12" r="2.5"/><circle cx="48" cy="12" r="2.5"/><circle cx="64" cy="12" r="2.5"/><circle cx="20" cy="32" r="2.5"/><circle cx="48" cy="32" r="2.5"/><circle cx="64" cy="32" r="2.5"/></g>
          {% when 'attention' %}
            <path class="research-gallery__faint" d="M9 22L66 6M9 22L66 16M9 22L66 28M9 22L66 38"/>
            <path d="M9 22L66 16M9 22L66 28"/>
            <g><circle cx="9" cy="22" r="3"/><circle cx="66" cy="6" r="2"/><circle cx="66" cy="16" r="4"/><circle cx="66" cy="28" r="3"/><circle cx="66" cy="38" r="2"/></g>
        {% endcase %}
      </svg>
      <span class="research-gallery__name">{{ demo.label }}</span>
      <span class="research-gallery__caption">{{ demo.caption }}</span>
    </a>
  {% endfor %}
  </div>
  <section class="research-gallery__panel" id="research-explorer" aria-labelledby="research-explorer-title" data-research-panel hidden>
    <div class="research-gallery__heading">
      <div>
        <p class="research-gallery__paper" data-research-paper></p>
        <h3 id="research-explorer-title" data-research-title></h3>
      </div>
      <button type="button" data-research-close aria-label="Close research visualization">×</button>
    </div>
    <div data-research-content></div>
  </section>
</section>
