# Site identity
locale: en-US
title: Majid Daliri
title_separator: "-"
name: Majid Daliri
description: Site for Majid Daliri
url: https://majid-daliri.github.io
baseurl: ""
repository: majid-daliri/majid-daliri.github.io
og_image: profile.jpg
twitter:
  username: daliri__majid

author:
  name: Majid Daliri
  avatar: profile.jpg
  bio: PhD student in Computer Science
  location: New York, NY
  googlescholar: https://scholar.google.com/citations?user=MatRqXUAAAAJ&hl=en
  github: majid-daliri
  twitter: daliri__majid

# Existing pages and collections
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - node_modules
  - vendor
  # Keep the CV files in the repository while the CV section is disabled.
  - cv.pdf
  - assets/cv

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: false
  - scope:
      path: ""
      type: teaching
    values:
      layout: teaching
      author_profile: false

# Rendering and GitHub Pages plugins
theme: null # Use the local templates without GitHub Pages' fallback theme.
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
future: true
permalink: /:categories/:title/
timezone: America/Los_Angeles
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
